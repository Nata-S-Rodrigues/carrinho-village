<!DOCTYPE html>
<html lang="pt-BR">

  <style>

    :root{

      --bg:#f4f7fb;
      --card:#fff;
      --text:#101828;
      --muted:#667085;

    *{

    }


    body{

<body>


<div class="app">


  <header>

    <div class="top">

      <div class="brand">

        <div class="logo">

          <img
            src="logo.png"
            alt="Carrinho Village"
            onerror="this.style.display='none';this.parentElement.innerHTML='🚗';"
          >

        </div>


        <div>

          <h1>
            Carrinho Village
          </h1>

          <div class="subtitle">
            Lembretes de testemunho público
          </div>

        </div>

      </div>


      <button
        class="refresh"
        onclick="carregar()"
        aria-label="Atualizar"
      >
        ↻
      </button>

    </div>


    <div class="hero">

      <p class="hero-title">
        Seus próximos lembretes
      </p>

      <p class="hero-text">
        Toque em “Abrir WhatsApp” para revisar e enviar a mensagem.
      </p>

    </div>

  </header>


  <main>


    <button
      id="installBtn"
      class="install"
    >
      📲 Instalar Carrinho Village
    </button>


    <div class="summary">

      <div class="stat">

        <strong id="pendentes">
          —
        </strong>

        <span>
          Lembretes pendentes
        </span>

      </div>


      <div class="stat">

        <strong id="total">
          —
        </strong>

        <span>
          Designações carregadas
        </span>

      </div>

    </div>


    <div class="section-head">

      <h2>
        Próximas designações
      </h2>

      <span
        class="count"
        id="atualizado"
      >
        Atualizando…
      </span>

    </div>


    <div
      id="lista"
      class="list"
    >

      <div class="loading">
        Carregando seus lembretes…
      </div>

    </div>


  </main>


  <div class="footer">
    Carrinho Village • versão 1.0
  </div>


</div>



<script>


/* =========================================================
   API
========================================================= */

const API =
  "https://script.google.com/macros/s/AKfycbw2oS_My7_WG0XWVF36aRWYwbNhO3u_h7cyNj9xYml6TKGAgkMK5pIo0E1SboMtAvr1PQ/exec?api=lembretes";



/* =========================================================
   SEGURANÇA
========================================================= */

function escapeHtml(valor){

  return String(valor ?? "")
    .replace(
      /[&<>"']/g,
      m => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m])
    );

}



/* =========================================================
   NORMALIZAR NOME
========================================================= */

function normalizarNome(nome){

  return String(nome || "")
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .trim()
    .toLowerCase()
    .replace(
      /\s+/g,
      " "
    );

}



/* =========================================================
   NORMALIZAR TELEFONE
========================================================= */

function normalizarNumero(valor){

  let numero =
    String(valor || "")
      .replace(
        /\D/g,
        ""
      );


  if(
    numero &&
    !numero.startsWith("55")
  ){

    numero =
      "55" +
      numero;

  }


  return numero;

}



/* =========================================================
   DATA
========================================================= */

function formatarData(valor){

  if(
    valor === null ||
    valor === undefined ||
    String(valor).trim() === ""
  ){

    return "Data não informada";

  }


  const texto =
    String(valor).trim();


  /*
   * API correta:
   *
   * 06/10/2026
   */

  const brasileira =
    texto.match(
      /^(\d{1,2})\/(\d{1,2})\/(\d{4})/
    );


  if(brasileira){

    return (
      brasileira[1].padStart(2,"0") +
      "/" +
      brasileira[2].padStart(2,"0") +
      "/" +
      brasileira[3]
    );

  }


  /*
   * Só tenta Date se realmente
   * não for uma data brasileira.
   */

  const data =
    new Date(texto);


  if(
    !isNaN(
      data.getTime()
    )
  ){

    return data.toLocaleDateString(
      "pt-BR",
      {
        timeZone:
          "America/Sao_Paulo"
      }
    );

  }


  return texto;

}



/* =========================================================
   HORÁRIO
========================================================= */

function formatarHorario(valor){

  if(
    valor === null ||
    valor === undefined ||
    String(valor).trim() === ""
  ){

    return "";

  }


  const texto =
    String(valor).trim();


  /*
   * PRIMEIRA REGRA:
   *
   * A API já manda:
   *
   * 08:30
   * 16:30
   *
   * Portanto usamos diretamente.
   */

  const simples =
    texto.match(
      /^(\d{1,2}):(\d{2})/
    );


  if(simples){

    return (
      simples[1].padStart(2,"0") +
      ":" +
      simples[2]
    );

  }


  /*
   * Compatibilidade com Date antigo.
   *
   * Exemplo:
   *
   * Sat Dec 30 1899 05:23:32 GMT...
   *
   * NÃO usamos isso para substituir
   * um horário que já veio como 08:30.
   */

  const antigo =
    texto.match(
      /1899.*?(\d{1,2}):(\d{2}):\d{2}/
    );


  if(antigo){

    return (
      antigo[1].padStart(2,"0") +
      ":" +
      antigo[2]
    );

  }


  return "";

}



/* =========================================================
   VERIFICAR SE EXISTE HORÁRIO
========================================================= */

function temHorario(valor){

  return (
    formatarHorario(valor) !== ""
  );

}



/* =========================================================
   DATA/HORA PARA ORDENAÇÃO
========================================================= */

function dataHora(item){

  const dataTexto =
    formatarData(
      item.data
    );


  const partes =
    dataTexto.split("/");


  if(
    partes.length !== 3
  ){

    return Number.MAX_SAFE_INTEGER;

  }


  const dia =
    Number(partes[0]);


  const mes =
    Number(partes[1]) - 1;


  const ano =
    Number(partes[2]);


  const horario =
    formatarHorario(
      item.horario
    );


  let hora = 0;
  let minuto = 0;


  const hm =
    horario.match(
      /^(\d{2}):(\d{2})$/
    );


  if(hm){

    hora =
      Number(hm[1]);

    minuto =
      Number(hm[2]);

  }


  return new Date(
    ano,
    mes,
    dia,
    hora,
    minuto
  ).getTime();

}



/* =========================================================
   MESMA DATA
========================================================= */

function mesmaData(a,b){

  return (
    formatarData(a) ===
    formatarData(b)
  );

}



/* =========================================================
   AGRUPAMENTO DE DUPLAS
========================================================= */

/*
 *
 * REGRA:
 *
 * Pessoa A -> Pessoa B
 *
 * procuramos Pessoa B na mesma data.
 *
 * Se B também indicar A como dupla,
 * melhor ainda.
 *
 * O horário NÃO é obrigatório.
 *
 * Isso evita que um problema de formato
 * do horário faça a dupla desaparecer.
 *
 */

function agruparDuplas(lista){

  const grupos = [];

  const usados =
    new Set();


  for(
    let i = 0;
    i < lista.length;
    i++
  ){

    if(
      usados.has(i)
    ){
      continue;
    }


    const pessoa =
      lista[i];


    const nomePessoa =
      normalizarNome(
        pessoa.nome
      );


    const nomeDupla =
      normalizarNome(
        pessoa.dupla
      );


    /*
     * Se não existe dupla
     * na planilha, permanece sozinho.
     */

    if(!nomeDupla){

      grupos.push({

        dataHora:
          dataHora(pessoa),

        pessoas:[
          pessoa
        ]

      });


      usados.add(i);

      continue;

    }


    let melhorIndice =
      -1;


    let melhorPontuacao =
      -1;


    /*
     * Procurar a pessoa indicada
     * como dupla.
     */

    for(
      let j = 0;
      j < lista.length;
      j++
    ){

      if(
        j === i ||
        usados.has(j)
      ){
        continue;
      }


      const candidata =
        lista[j];


      /*
       * O nome precisa ser exatamente
       * o nome informado em "Dupla".
       */

      if(
        normalizarNome(
          candidata.nome
        ) !== nomeDupla
      ){

        continue;

      }


      /*
       * Precisa ser a mesma data.
       */

      if(
        !mesmaData(
          pessoa.data,
          candidata.data
        )
      ){

        continue;

      }


      const nomeDuplaCandidata =
        normalizarNome(
          candidata.dupla
        );


      let pontuacao =
        1;


      /*
       * Se for recíproco:
       *
       * Albertina -> Elma
       * Elma -> Albertina
       *
       * recebe prioridade.
       */

      if(
        nomeDuplaCandidata ===
        nomePessoa
      ){

        pontuacao += 10;

      }


      /*
       * Se os horários forem iguais,
       * damos mais prioridade.
       */

      const horarioA =
        formatarHorario(
          pessoa.horario
        );


      const horarioB =
        formatarHorario(
          candidata.horario
        );


      if(
        horarioA &&
        horarioB &&
        horarioA === horarioB
      ){

        pontuacao += 5;

      }


      /*
       * Se a candidata estiver sem horário,
       * não eliminamos a dupla.
       *
       * Isso é importante.
       */

      if(
        !horarioA ||
        !horarioB
      ){

        pontuacao += 1;

      }


      /*
       * Escolher a melhor candidata.
       */

      if(
        pontuacao >
        melhorPontuacao
      ){

        melhorPontuacao =
          pontuacao;

        melhorIndice =
          j;

      }

    }


    /*
     * ENCONTROU A DUPLA
     */

    if(
      melhorIndice !== -1
    ){

      const dupla =
        lista[melhorIndice];


      grupos.push({

        dataHora:
          Math.min(
            dataHora(pessoa),
            dataHora(dupla)
          ),

        pessoas:[
          pessoa,
          dupla
        ]

      });


      usados.add(i);
      usados.add(
        melhorIndice
      );

    }


    /*
     * NÃO ENCONTROU
     */

    else{

      grupos.push({

        dataHora:
          dataHora(pessoa),

        pessoas:[
          pessoa
        ]

      });


      usados.add(i);

    }

  }


  return grupos.sort(
    (a,b) =>
      a.dataHora -
      b.dataHora
  );

}



/* =========================================================
   HORÁRIO DO GRUPO
========================================================= */

function horarioDoGrupo(grupo){

  /*
   * Primeiro tenta encontrar um horário
   * válido entre todas as pessoas.
   */

  for(
    const pessoa of grupo.pessoas
  ){

    const horario =
      formatarHorario(
        pessoa.horario
      );


    if(horario){

      return horario;

    }

  }


  return "Horário não informado";

}



/* =========================================================
   MENSAGEM
========================================================= */

function mensagem(item){

  /*
   * Se a API já mandou a mensagem pronta,
   * usamos exatamente ela.
   */

  if(
    item.mensagem
  ){

    return item.mensagem;

  }


  const horario =
    formatarHorario(
      item.horario
    );


  return (
    `Olá, ${item.nome || ""}! 😊\n\n` +

    `Passando para lembrar que você está ` +
    `designado(a) para o carrinho de ` +
    `testemunho público no dia ` +

    `${formatarData(item.data)}` +

    `${horario ? `, às ${horario}` : ""}.` +

    `\n\nSua dupla será: ` +

    `${item.dupla || ""}.` +

    `\n\nAgradecemos pela sua disposição ` +
    `em apoiar essa atividade! 💚`
  );

}



/* =========================================================
   WHATSAPP
========================================================= */

function abrirWhatsApp(item){

  const numero =
    normalizarNumero(
      item.whatsapp
    );


  if(!numero){

    alert(
      "Este cadastro não possui número de WhatsApp."
    );

    return;

  }


  const texto =
    mensagem(item);


  window.location.href =
    `https://wa.me/${numero}?text=${encodeURIComponent(texto)}`;

}



/* =========================================================
   COPIAR
========================================================= */

function marcarCopiar(item){

  const texto =
    mensagem(item);


  if(
    navigator.clipboard
  ){

    navigator.clipboard
      .writeText(texto)
      .then(
        () =>
          alert(
            "Mensagem copiada!"
          )
      )
      .catch(
        () =>
          alert(texto)
      );

  }
  else{

    alert(texto);

  }

}



/* =========================================================
   STATUS
========================================================= */

function statusLimpo(status){

  let texto =
    String(
      status ||
      "Pendente"
    ).trim();


  /*
   * Evita:
   *
   * 🟡 🟡 Pendente
   */

  texto =
    texto.replace(
      /^🟡\s*/u,
      ""
    );


  return texto;

}



/* =========================================================
   RENDER
========================================================= */

function render(listaOriginal){

  const lista =
    document.getElementById(
      "lista"
    );


  if(
    !Array.isArray(
      listaOriginal
    )
  ){

    listaOriginal = [];

  }


  /*
   * Primeiro agrupamos.
   */

  const grupos =
    agruparDuplas(
      listaOriginal
    );


  /*
   * Quantidade de pessoas
   */

  document.getElementById(
    "total"
  ).textContent =
    listaOriginal.length;


  /*
   * Quantidade de pessoas pendentes
   */

  const pendentes =
    listaOriginal.filter(
      item =>
        statusLimpo(
          item.status
        )
        .toLowerCase()
        .includes(
          "pend"
        )
    ).length;


  document.getElementById(
    "pendentes"
  ).textContent =
    pendentes;


  document.getElementById(
    "atualizado"
  ).textContent =
    "Atualizado agora";


  /*
   * Nenhum registro
   */

  if(
    !grupos.length
  ){

    lista.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          🎉
        </div>

        <b>
          Nenhum lembrete pendente
        </b>

        <p>
          Quando houver uma nova designação,
          ela aparecerá aqui.
        </p>

      </div>

    `;

    return;

  }


  /*
   * Criar cartões
   */

  lista.innerHTML =
    grupos.map(
      grupo => {


        const pessoas =
          grupo.pessoas;


        const primeira =
          pessoas[0];


        /*
         * Nomes
         */

        const nomes =
          pessoas
            .map(
              pessoa =>
                escapeHtml(
                  pessoa.nome ||
                  "Sem nome"
                )
            )
            .join(
              " + "
            );


        /*
         * Data
         */

        const data =
          formatarData(
            primeira.data
          );


        /*
         * HORÁRIO DO GRUPO
         *
         * Aqui está a correção importante:
         * NÃO usamos diretamente
         * primeira.horario.
         */

        const horario =
          horarioDoGrupo(
            grupo
          );


        /*
         * Status
         */

        const status =
          statusLimpo(
            primeira.status
          );


        const statusLower =
          status.toLowerCase();


        const classeStatus =
          statusLower.includes(
            "enviado"
          )
            ? "enviado"
            : statusLower.includes(
                "erro"
              )
                ? "erro"
                : "";


        /*
         * Mensagem.
         *
         * Para dupla usamos a mensagem
         * da primeira pessoa, porque cada
         * botão abre o WhatsApp da pessoa
         * correspondente.
         */


        return `

          <article class="card">

            <div class="card-top">

              <div>

                <p class="person">
                  ${nomes}
                </p>


                <div class="date">

                  📅
                  ${escapeHtml(data)}

                </div>

              </div>


              <span
                class="badge ${classeStatus}"
              >

                ${escapeHtml(status)}

              </span>

            </div>


            <div class="details">


              <div class="detail">

                <small>
                  Horário
                </small>

                <b>

                  🕐
                  ${escapeHtml(
                    horario
                  )}

                </b>

              </div>


              <div class="detail">

                <small>
                  Dupla
                </small>

                <b>

                  👥

                  ${
                    pessoas.length > 1
                      ? escapeHtml(
                          pessoas
                            .map(
                              p =>
                                p.nome
                            )
                            .join(
                              " + "
                            )
                        )
                      : escapeHtml(
                          primeira.dupla ||
                          "Não informada"
                        )
                  }

                </b>

              </div>


            </div>


            <div class="message">

              ${escapeHtml(
                mensagem(
                  primeira
                )
              ).replace(
                /\n/g,
                "<br>"
              )}

            </div>


            <div class="actions">

              ${
                pessoas
                  .map(
                    pessoa => `

                      <button
                        class="btn btn-primary"
                        onclick='abrirWhatsApp(${JSON.stringify(
                          pessoa
                        ).replace(
                          /</g,
                          "\\u003c"
                        )})'
                      >

                        💬
                        ${escapeHtml(
                          pessoa.nome
                        )}

                      </button>

                    `
                  )
                  .join("")
              }


              <button
                class="btn btn-secondary"
                onclick='marcarCopiar(${JSON.stringify(
                  primeira
                ).replace(
                  /</g,
                  "\\u003c"
                )})'
              >

                📋 Copiar

              </button>

            </div>


          </article>

        `;

      }
    ).join("");

}



/* =========================================================
   CARREGAR API
========================================================= */

async function carregar(){

  const lista =
    document.getElementById(
      "lista"
    );


  lista.innerHTML =
    `
      <div class="loading">
        Atualizando lembretes…
      </div>
    `;


  try{

    const resposta =
      await fetch(
        API +
        "&_=" +
        Date.now(),
        {
          cache:
            "no-store"
        }
      );


    if(
      !resposta.ok
    ){

      throw new Error(
        "HTTP " +
        resposta.status
      );

    }


    const data =
      await resposta.json();


    console.log(
      "API COMPLETA:",
      data
    );


    /*
     * SUA API USA "itens".
     *
     * Não usamos "items".
     */

    const itens =
      Array.isArray(
        data.itens
      )
        ? data.itens
        : [];


    /*
     * Normaliza os horários
     * antes de renderizar.
     *
     * NÃO modifica a API.
     * Apenas o que fica em memória
     * no aplicativo.
     */

    const itensNormalizados =
      itens.map(
        item => ({

          ...item,

          horario:
            formatarHorario(
              item.horario
            )

        })
      );


    render(
      itensNormalizados
    );


  }
  catch(erro){

    console.error(
      "Erro ao carregar:",
      erro
    );


    lista.innerHTML = `

      <div class="error">

        <b>
          Não foi possível atualizar.
        </b>

        <p>
          ${escapeHtml(
            erro.message
          )}
        </p>


        <button
          class="btn btn-secondary"
          onclick="carregar()"
        >

          Tentar novamente

        </button>

      </div>

    `;


    document.getElementById(
      "atualizado"
    ).textContent =
      "Falha na atualização";

  }

}



/* =========================================================
   PWA
========================================================= */

let deferredPrompt;


window.addEventListener(
  "beforeinstallprompt",
  event => {

    event.preventDefault();

    deferredPrompt =
      event;


    document.getElementById(
      "installBtn"
    ).style.display =
      "block";

  }
);


document.getElementById(
  "installBtn"
).onclick =
  async () => {

    if(
      !deferredPrompt
    ){

      return;

    }


    deferredPrompt.prompt();


    await
      deferredPrompt.userChoice;


    deferredPrompt =
      null;


    document.getElementById(
      "installBtn"
    ).style.display =
      "none";

  };



/* =========================================================
   SERVICE WORKER
========================================================= */

if(
  "serviceWorker"
  in navigator
){

  window.addEventListener(
    "load",
    () => {

      navigator
        .serviceWorker
        .register(
          "sw.js"
        )
        .catch(
          erro =>
            console.error(
              "Service Worker:",
              erro
            )
        );

    }
  );

}



/* =========================================================
   INICIAR
========================================================= */

carregar();


setInterval(
  carregar,
  5 * 60 * 1000
);


</script>
