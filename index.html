    /* =====================================================
       FUNÇÕES AUXILIARES E DE FORMATAÇÃO
    ===================================================== */
    function normalizarNome(nome) {
      return String(nome || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, " ");
    }

    function formatarHorario(horarioStr) {
      return horarioStr || "Horário não informado";
    }

    function dataHora(pessoa) {
      if (!pessoa.data) return new Date(0);
      const partes = pessoa.data.split('/');
      if (partes.length !== 3) return new Date(0);
      const [dia, mes, ano] = partes;
      const horario = (pessoa.horario && pessoa.horario.length >= 5) ? pessoa.horario : "00:00";
      return new Date(`${ano}-${mes}-${dia}T${horario}:00`);
    }

    function horarioValido(valor) {
      if (valor === null || valor === undefined || String(valor).trim() === "") {
        return false;
      }
      const texto = String(valor).trim();
      return /^\d{1,2}:\d{2}/.test(texto) || /(?:19\d{2}|20\d{2}).*?\d{1,2}:\d{2}/.test(texto);
    }

    function obterHorarioDoGrupo(pessoas) {
      for (const pessoa of pessoas) {
        if (horarioValido(pessoa.horario)) {
          return formatarHorario(pessoa.horario);
        }
      }
      return "Horário não informado";
    }

    /* =====================================================
       AGRUPAR DUPLAS (LÓGICA ROBUSTA BASEADA NO JSON)
    ===================================================== */
    function agruparDuplas(lista) {
      const grupos = [];
      const usados = new Set();

      for (let i = 0; i < lista.length; i++) {
        if (usados.has(i)) continue;

        const pessoa = lista[i];
        const nomeDupla = normalizarNome(pessoa.dupla);
        let indiceDupla = -1;

        if (nomeDupla) {
          for (let j = 0; j < lista.length; j++) {
            if (j === i || usados.has(j)) continue;

            const outra = lista[j];
            const nomeOutra = normalizarNome(outra.nome);
            const duplaOutra = normalizarNome(outra.dupla);

            if (nomeOutra === nomeDupla || duplaOutra === normalizarNome(pessoa.nome)) {
              indiceDupla = j;
              break;
            }
          }
        }

        if (indiceDupla !== -1) {
          const outra = lista[indiceDupla];
          grupos.push({
            dataHora: dataHora(pessoa),
            data: pessoa.data,
            horario: obterHorarioDoGrupo([pessoa, outra]),
            pessoas: [pessoa, outra]
          });
          usados.add(i);
          usados.add(indiceDupla);
        }
      }

      for (let i = 0; i < lista.length; i++) {
        if (usados.has(i)) continue;

        const pessoa = lista[i];
        grupos.push({
          dataHora: dataHora(pessoa),
          data: pessoa.data,
          horario: obterHorarioDoGrupo([pessoa]),
          pessoas: [pessoa]
        });
        usados.add(i);
      }

      return grupos.sort((a, b) => a.dataHora - b.dataHora);
    }

    /* =====================================================
       RENDERIZAR NA TELA
    ===================================================== */
    function renderizarPainel(dados) {
      const container = document.getElementById('painel-container');
      container.innerHTML = '';

      const grupos = agruparDuplas(dados);

      grupos.forEach(grupo => {
        const card = document.createElement('div');
        card.className = 'card-grupo';

        let botoesHtml = '';
        grupo.pessoas.forEach(p => {
          botoesHtml += `
            <a href="https://api.whatsapp.com/send?phone=${p.whatsapp}&text=${encodeURIComponent(p.mensagem || '')}" target="_blank" class="botao-pessoa">
              💬 ${p.nome}
            </a>
          `;
        });

        card.innerHTML = `
          <div class="card-header">
            <span class="data-horario">📅 ${grupo.data || 'Data não informada'} — ⏰ ${grupo.horario}</span>
            <span class="status-pendente">🟡 Pendente</span>
          </div>
          <div class="pessoas-lista">
            ${botoesHtml}
          </div>
        `;

        container.appendChild(card);
      });
    }

    /* =====================================================
       INICIALIZAÇÃO
    ===================================================== */
    function carregarDados() {
      if (dadosApi.sucesso && Array.isArray(dadosApi.itens)) {
        renderizarPainel(dadosApi.itens);
      } else {
        document.getElementById('painel-container').innerHTML = '<p>Erro ao processar os dados.</p>';
      }
    }

    carregarDados();
  </script>
